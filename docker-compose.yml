# LaraDogs — "Personal" profile.
#
# Minimal single-container setup for local/self-hosted use, running SQLite.
# SQLite is this image's current implementation choice, not an
# architectural requirement — LaraDogs also officially supports MySQL,
# MariaDB, and PostgreSQL (see docs/architecture/decisions/ADR-0007), just
# not yet wired into this Docker image (docs/development/docker.md).
# The future "Server" profile (Redis, queue workers, scheduler, reverse
# proxy) is tracked in docs/roadmap/roadmap.md and is intentionally not
# built here — see ADR-0005.
#
# First run:
#   cp .env.example .env
#   docker compose up --build

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - laradogs-database:/app/database
            - laradogs-storage:/app/storage
        restart: unless-stopped

volumes:
    laradogs-database:
    laradogs-storage:
